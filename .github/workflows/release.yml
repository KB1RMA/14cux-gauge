name: Release
run-name: Release ${{ github.event.release.tag_name || github.ref_name }}

# Publishing a GitHub release tests and builds the tagged commit once, runs the
# acceptance suite against that build in Chromium, Firefox and WebKit, and only
# if it passes:
#   - attaches the built app to the release with three signed attestations:
#       - SLSA build provenance (which workflow, commit and runner built it)
#       - a CycloneDX SBOM of the runtime dependencies bundled into it
#       - an in-toto test result listing the unit and acceptance tests that
#         passed against it
#     Each attestation is stored by GitHub and also attached to the release as
#     a Sigstore bundle, so it can be verified offline. See "Verifying a
#     release" in README.md.
#   - deploys the same build to GitHub Pages, unless it is a prerelease.

permissions:
  contents: read

on:
  release:
    types:
      - published
  # Re-deploys a release to Pages by hand, for example after changing the
  # Pages settings, or with attach-assets set re-attaches its attested build.
  # The ref must be a release's tag; the run fails on a branch.
  workflow_dispatch:
    inputs:
      attach-assets:
        description: Attach the attested build to the release, not just deploy it
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  APP_DIR: 14cux-gauge
  TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  build:
    name: Test, build and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      # Only a release's tag may reach Pages, including on a manual run.
      - name: Check the ref is a release
        id: release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::Run this workflow on a release tag, not ${GITHUB_REF}."
            exit 1
          fi
          prerelease=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          path: ${{ env.APP_DIR }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.APP_DIR }}/.nvmrc
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - run: npm ci

      - name: Test
        run: >
          npx vitest --run --coverage
          --reporter=default --reporter=github-actions --reporter=json
          --outputFile.json=test-reports/results.json

      # Stamps the release into the footer; the build fails if the tag does
      # not match package.json's version.
      - name: Build
        env:
          RELEASE_TAG: ${{ env.TAG }}
        run: npm run build

      - name: Package
        id: package
        run: |
          mkdir -p release
          name="14cux-gauge-${TAG}"
          (cd dist && zip -r -X "../release/${name}.zip" .)
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      # Runtime dependencies only: dev tools are not bundled into the app.
      - name: Generate SBOM
        run: >
          npm sbom --sbom-format cyclonedx --omit dev
          > "release/${{ steps.package.outputs.name }}.cdx.json"

      # https://github.com/in-toto/attestation/blob/main/spec/predicates/test-result.md
      # The configuration records the test setup and the lockfile, which pins
      # the exact @kb1rma/libcomm14cux-ts release (with its integrity hash) the
      # tests ran against. The publish job adds the acceptance results once the
      # suite has run.
      - name: Build unit test result predicate
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          configuration=$(
            sha256sum vite.config.ts playwright.config.ts package-lock.json |
              jq -R -s 'split("\n") | map(select(length > 0) | split("  ") | {name: .[1], digest: {sha256: .[0]}})'
          )
          jq --arg url "$RUN_URL" --arg root "$PWD/" --argjson configuration "$configuration" '
            def tests($status): [
              .testResults[]
              | (.name | ltrimstr($root)) as $file
              | .assertionResults[]
              | select(.status == $status)
              | "\($file) > \(.fullName)"
            ];
            {
              result: (if .success then "PASSED" else "FAILED" end),
              configuration: $configuration,
              url: $url,
              passedTests: tests("passed"),
              warnedTests: [],
              failedTests: tests("failed")
            }' test-reports/results.json > release/unit-test-result.json

      - name: Upload the production build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ${{ env.APP_DIR }}/dist
          if-no-files-found: error
          retention-days: 30
      - name: Upload the release package
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ env.APP_DIR }}/release
          if-no-files-found: error
          retention-days: 30
    outputs:
      name: ${{ steps.package.outputs.name }}
      prerelease: ${{ steps.release.outputs.prerelease }}

  acceptance:
    name: Acceptance
    needs: build
    uses: ./.github/workflows/acceptance.yml
    with:
      dist-artifact: dist
    secrets: inherit

  publish:
    name: Attest and upload to the release
    needs: [build, acceptance]
    if: ${{ github.event_name == 'release' || inputs.attach-assets }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets
      id-token: write # sign attestations with Sigstore
      attestations: write # store attestations on the repository
    env:
      NAME: ${{ needs.build.outputs.name }}
    steps:
      - name: Download the tested package
        uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Download the acceptance results
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-report-*
          path: e2e

      # Adds each browser's Playwright results to the unit test predicate,
      # named "<file> > <describe> > <test> [<browser>]".
      - name: Build test result predicate
        run: |
          jq -s '
            def walk($prefix):
              (.specs[]? as $spec | $spec.tests[]
                | {name: "e2e/\($spec.file) > \($prefix)\($spec.title) [\(.projectName)]", status}),
              (.suites[]? as $suite | $suite | walk($prefix + $suite.title + " > "));
            .[0] as $unit
            | [.[1:][] | .suites[] | walk("")] as $e2e
            | $unit
            | .passedTests += [$e2e[] | select(.status == "expected") | .name]
            | .warnedTests += [$e2e[] | select(.status == "flaky") | .name]
            | .failedTests += [$e2e[] | select(.status == "unexpected") | .name]
            | .result = (if $unit.result == "PASSED" and .failedTests == [] then "PASSED" else "FAILED" end)
          ' release/unit-test-result.json e2e/*/results.json > test-result.json
          rm release/unit-test-result.json

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: release/${{ env.NAME }}.zip

      - name: Attest SBOM
        id: sbom
        uses: actions/attest@v4
        with:
          subject-path: release/${{ env.NAME }}.zip
          sbom-path: release/${{ env.NAME }}.cdx.json

      - name: Attest test results
        id: test-result
        uses: actions/attest@v4
        with:
          subject-path: release/${{ env.NAME }}.zip
          predicate-type: https://in-toto.io/attestation/test-result/v0.1
          predicate-path: test-result.json

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
          TEST_RESULT_BUNDLE: ${{ steps.test-result.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "release/${NAME}.provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "release/${NAME}.sbom.sigstore.json"
          cp "$TEST_RESULT_BUNDLE" "release/${NAME}.test-result.sigstore.json"
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, acceptance, publish]
    # Only once the release's attested assets are uploaded (publish is skipped
    # on a manual re-deploy), and never for a prerelease.
    if: >-
      ${{ !cancelled()
      && needs.acceptance.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
      && needs.build.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One Pages deployment at a time across releases; never cancel one that
    # has started.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the tested build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
